<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Catalogue</title>
  <style>
    :root { --ink:#24233a; --muted:#74728a; --line:#dedcf0; --paper:#fff; --canvas:#f4f2fc; --pine:#a29aee; --mint:#ebe9ff; --gold:#c68724; --coral:#be5948; }
    * { box-sizing:border-box; }
    body { min-width:320px; margin:0; color:var(--ink); background-color:var(--canvas); background-image:linear-gradient(90deg,rgba(162,154,238,.08) 1px,transparent 1px),linear-gradient(rgba(162,154,238,.08) 1px,transparent 1px); background-size:28px 28px; font-family:Georgia,"Times New Roman",serif; }
    button,input,select { font:inherit; }
    .shell { max-width:1320px; margin:0 auto; padding:38px 28px 52px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:24px; padding:8px 4px 29px; }
    .eyebrow,label { margin:0 0 8px; color:var(--pine); font-family:"Trebuchet MS",sans-serif; font-size:10px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(34px,4vw,54px); font-weight:400; line-height:1; }
    .subhead { max-width:510px; margin:11px 0 0; color:var(--muted); font-size:16px; line-height:1.5; }
    .view-label { margin:0; color:var(--muted); font-family:"Trebuchet MS",sans-serif; font-size:11px; text-align:right; }
    .view-label strong { display:block; margin-top:4px; color:var(--ink); font-size:13px; }
    .catalogue { overflow:hidden; border:1px solid var(--line); background:var(--paper); box-shadow:0 16px 38px rgba(28,50,46,.09); }
    .filters { display:grid; grid-template-columns:minmax(190px,1.6fr) repeat(4,minmax(120px,.8fr)) auto; gap:12px; padding:20px; border-bottom:1px solid var(--line); background:#fbfaff; }
    .control { min-width:0; }
    label { display:block; margin-bottom:6px; color:var(--muted); }
    .filter-hint { margin-left:5px; color:#9794aa; font-size:9px; font-weight:400; letter-spacing:.5px; text-transform:none; }
    input,select { width:100%; height:40px; border:1px solid #c9c6df; border-radius:3px; padding:0 11px; color:var(--ink); background:#fff; font-size:14px; outline:0; }
    select[multiple] { height:auto; min-height:40px; padding:7px 11px; }
    input:focus,select:focus { border-color:var(--pine); box-shadow:0 0 0 3px rgba(162,154,238,.2); }
    #reset { align-self:end; height:40px; border:1px solid var(--pine); border-radius:3px; padding:0 15px; color:var(--pine); background:transparent; font-family:"Trebuchet MS",sans-serif; font-size:13px; font-weight:700; cursor:pointer; }
    #reset:hover { color:#fff; background:var(--pine); }
    .summary { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 20px; border-bottom:1px solid var(--line); }
    .summary p { margin:0; font-family:"Trebuchet MS",sans-serif; font-size:13px; font-weight:700; }
    #result-count { color:var(--pine); }
    .legend { display:flex; flex-wrap:wrap; gap:13px; color:var(--muted); font-family:"Trebuchet MS",sans-serif; font-size:11px; }
    .legend span { display:flex; align-items:center; gap:5px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--pine); }.medium { background:var(--gold); }.large { background:var(--coral); }
    .table-wrap { overflow-x:auto; } table { width:100%; min-width:810px; border-collapse:collapse; text-align:left; }
    th { padding:0; border-bottom:1px solid var(--line); background:#f6f5fc; }
    th button { display:flex; width:100%; align-items:center; gap:7px; border:0; padding:13px 20px; color:var(--muted); background:transparent; font-family:"Trebuchet MS",sans-serif; font-size:10px; font-weight:700; letter-spacing:1px; text-align:left; text-transform:uppercase; cursor:pointer; }
    th button:hover,th button[aria-sort="ascending"],th button[aria-sort="descending"] { color:var(--pine); }
    td { padding:17px 20px; border-bottom:1px solid #e8e6f1; font-size:15px; } tbody tr:hover { background:#faf9ff; } tbody tr:last-child td { border:0; }
    .project-name { font-weight:700; }.description { max-width:350px; color:var(--muted); }.language { color:var(--pine); font-family:"Trebuchet MS",sans-serif; font-size:13px; font-weight:700; }
    .language a { color:inherit; }
    .pill { display:inline-block; border-radius:999px; padding:4px 9px; font-family:"Trebuchet MS",sans-serif; font-size:11px; font-weight:700; line-height:1; text-transform:capitalize; }.size-small { color:#625bb0; background:#e9e7ff; }.size-medium { color:#865608; background:#fbefd5; }.size-large { color:#923d2c; background:#fae1dc; }
    .empty td { padding:54px 20px; color:var(--muted); text-align:center; }
    @media (max-width:820px) { .shell{padding:20px 14px 32px} header{align-items:start;flex-direction:column;gap:16px}.view-label{text-align:left}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.control:first-child{grid-column:1/-1}#reset{width:100%}.summary{align-items:start;flex-direction:column} }
    @media (max-width:460px) { .filters{grid-template-columns:1fr}.control:first-child{grid-column:auto} }
  </style>
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">Warwick SCRTP RSE</p><h1>Project catalogue</h1><p class="subhead">A (non-exhaustive) listing of projects we have undertaken. Explore by language, scale, duration, or date to see what we've been up to.</p></p></div><p class="view-label">CURRENT VIEW<strong id="view-label">All projects</strong></p></header>
    <section class="catalogue" aria-label="Project catalogue data">
      <div class="filters">
        <div class="control"><label for="search">Search records</label><input id="search" type="search" placeholder="Name, language, or description"></div>
        <div class="control"><label for="language-filter">Language <span class="filter-hint">select one or more</span></label><select id="language-filter" multiple size="3" aria-label="Filter by one or more languages"></select></div>
        <div class="control"><label for="duration-filter">Duration</label><select id="duration-filter"><option value="">Any duration</option><option value="0-3">0-3 months</option><option value="3-12">3-12 months</option><option value="12-plus">12+ months</option><option value="ongoing">Ongoing</option></select></div>
        <div class="control"><label for="size-filter">Project size</label><select id="size-filter"><option value="">All sizes</option></select></div>
        <div class="control"><label for="date-filter">Start date</label><select id="date-filter"><option value="">All time</option><option value="last-year">This year</option><option value="1-5-years">1-5 years ago</option><option value="5-plus-years">More than 5 years ago</option></select></div>
        <button id="reset" type="button">Reset view</button>
      </div>
      <div class="summary"><p><span id="result-count">0</span> projects shown</p><div class="legend"><span><i class="dot"></i>Small</span><span><i class="dot medium"></i>Medium</span><span><i class="dot large"></i>Large</span></div></div>
      <div class="table-wrap"><table><thead><tr id="table-head"></tr></thead><tbody id="table-body"></tbody></table></div>
    </section>
  </main>
  <script src="projects.js"></script>
  <script>
    const columns = Object.keys(projects[0] || {});
    const labels = { name:'Project', language:'Language', description:'Description', duration:'Duration', date:'Start Date', size:'Size' };
    const state = { search:'', language:[], size:'', duration:'', date:'', sort:'name', direction:'asc' };
    const tableHead = document.querySelector('#table-head');
    const tableBody = document.querySelector('#table-body');

    function valueForSort(project, field) {
      if (field === 'duration') return Number(project[field]);
      if (field === 'date') { const [month, day, year] = project[field].split('-').map(Number); return new Date(2000 + year, month - 1, day).getTime(); }
      if (field === 'size') return ({ small:1, medium:2, large:3 })[String(project[field]).toLowerCase()] || 99;
      if (field === 'language') return languageValues(project).join(', ').toLowerCase();
      return String(project[field] || '').toLowerCase();
    }

    function languageValues(project) {
      return Array.isArray(project.language) ? project.language : [project.language];
    }

    function durationLabel(value) {
      return String(value) === '-1' ? 'Ongoing' : `${value} months`;
    }

    function durationMatches(project, filter) {
      const duration = Number(project.duration);
      if (!filter) return true;
      if (filter === 'ongoing') return duration === -1;
      if (filter === '0-3') return duration >= 0 && duration < 3;
      if (filter === '3-12') return duration >= 3 && duration < 12;
      if (filter === '12-plus') return duration >= 12;
      return false;
    }

    function dateYear(project) {
      return 2000 + Number(project.date.split('-').pop());
    }

    function dateMatches(project, filter) {
      if (!filter) return true;
      const yearsAgo = new Date().getFullYear() - dateYear(project);
      if (filter === 'last-year') return yearsAgo >= 0 && yearsAgo <= 1;
      if (filter === '1-5-years') return yearsAgo > 1 && yearsAgo <= 5;
      if (filter === '5-plus-years') return yearsAgo > 5;
      return false;
    }

    function populateFilter(selector, field) {
      const select = document.querySelector(selector);
      const values = field === 'language' ? projects.flatMap((project) => languageValues(project)) : projects.map((project) => project[field]);
      [...new Set(values)].sort().forEach((value) => select.add(new Option(field === 'duration' ? durationLabel(value) : value, value)));
    }

    function loadFiltersFromUrl() {
      const params = new URLSearchParams(window.location.search);
      state.search = params.get('search') || '';
      state.language = params.getAll('language');
      if (!state.language.length && params.get('language')) state.language = params.get('language').split(',').filter(Boolean);
      state.size = params.get('size') || '';
      state.duration = params.get('duration') || '';
      state.date = params.get('date') || '';
    }

    function applyFiltersToControls() {
      document.querySelector('#search').value = state.search;
      document.querySelector('#size-filter').value = state.size;
      document.querySelector('#duration-filter').value = state.duration;
      document.querySelector('#date-filter').value = state.date;
      [...document.querySelector('#language-filter').options].forEach((option) => {
        option.selected = state.language.includes(option.value);
      });
    }

    function updateUrl() {
      const params = new URLSearchParams();
      if (state.search) params.set('search', state.search);
      state.language.forEach((language) => params.append('language', language));
      if (state.size) params.set('size', state.size);
      if (state.duration) params.set('duration', state.duration);
      if (state.date) params.set('date', state.date);
      const query = params.toString();
      window.history.replaceState(null, '', `${window.location.pathname}${query ? `?${query}` : ''}${window.location.hash}`);
    }

    function languageUrl(language) {
      const params = new URLSearchParams();
      if (state.search) params.set('search', state.search);
      params.set('language', language);
      if (state.size) params.set('size', state.size);
      if (state.duration) params.set('duration', state.duration);
      if (state.date) params.set('date', state.date);
      return `${window.location.pathname}?${params.toString()}${window.location.hash}`;
    }

    function renderHeaders() {
      tableHead.replaceChildren();
      columns.forEach((column) => {
        const cell = document.createElement('th'); const button = document.createElement('button');
        button.type = 'button'; button.textContent = labels[column] || column;
        button.setAttribute('aria-sort', state.sort === column ? (state.direction === 'asc' ? 'ascending' : 'descending') : 'none');
        if (state.sort === column) button.append(` ${state.direction === 'asc' ? '▲' : '▼'}`);
        button.addEventListener('click', () => { state.direction = state.sort === column && state.direction === 'asc' ? 'desc' : 'asc'; state.sort = column; render(); });
        cell.appendChild(button); tableHead.appendChild(cell);
      });
    }

    function render() {
      updateUrl();
      const term = state.search.trim().toLowerCase();
      const visible = projects.filter((project) =>
        (!term || ['name','description'].some((field) => String(project[field] || '').toLowerCase().includes(term)) || languageValues(project).some((language) => language.toLowerCase().includes(term))) &&
        (!state.language.length || state.language.some((language) => languageValues(project).includes(language))) && (!state.size || project.size === state.size) && durationMatches(project, state.duration) && dateMatches(project, state.date)
      ).sort((a, b) => { const result = valueForSort(a, state.sort) < valueForSort(b, state.sort) ? -1 : valueForSort(a, state.sort) > valueForSort(b, state.sort) ? 1 : 0; return state.direction === 'asc' ? result : -result; });
      renderHeaders(); tableBody.replaceChildren();
      document.querySelector('#result-count').textContent = visible.length;
      document.querySelector('#view-label').textContent = visible.length === projects.length ? 'All projects' : 'Filtered projects';
      if (!visible.length) { const row = tableBody.insertRow(); row.className = 'empty'; const cell = row.insertCell(); cell.colSpan = columns.length; cell.textContent = 'No projects match these filters.'; return; }
      visible.forEach((project) => { const row = tableBody.insertRow(); columns.forEach((column) => { const cell = row.insertCell(); const value = project[column] ?? ''; if (column === 'name') cell.className = 'project-name'; if (column === 'description') cell.className = 'description'; if (column === 'language') { cell.className = 'language'; languageValues(project).forEach((language, index) => { if (index) cell.append(', '); const link = document.createElement('a'); link.href = languageUrl(language); link.textContent = language; cell.appendChild(link); }); } else if (column === 'size') { const badge = document.createElement('span'); badge.className = `pill size-${String(value).toLowerCase()}`; badge.textContent = value; cell.appendChild(badge); } else { cell.textContent = column === 'duration' ? durationLabel(value) : value; } }); });
    }

    populateFilter('#language-filter', 'language'); populateFilter('#size-filter', 'size'); loadFiltersFromUrl(); applyFiltersToControls();
    [['#search','search','input'],['#language-filter','language','change'],['#size-filter','size','change'],['#duration-filter','duration','change'],['#date-filter','date','change']].forEach(([selector, field, event]) => document.querySelector(selector).addEventListener(event, (input) => { state[field] = field === 'language' ? [...input.target.selectedOptions].map((option) => option.value) : input.target.value; render(); }));
    document.querySelector('#reset').addEventListener('click', () => { Object.assign(state, { search:'', language:[], size:'', duration:'', date:'', sort:'name', direction:'asc' }); ['#search','#size-filter','#duration-filter','#date-filter'].forEach((selector) => { document.querySelector(selector).value = ''; }); document.querySelector('#language-filter').selectedIndex = -1; render(); });
    render();
  </script>
</body>
</html>
