<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Catalogue</title>
  <style>
    .layout { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
    .pie-wrap { position: relative; width: 100%; max-width: 450px; aspect-ratio: 536.64 / 544.32; flex: 1 1 300px; }
    .pie-wrap img { display: block; width: 100%; height: 100%; }
    .pie-slice {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-repeat: no-repeat; background-size: 100% 100%;
      cursor: pointer; transition: transform .25s ease, filter .25s ease;
    }
    .pie-slice:hover { filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
    .pie-slice:focus { outline: none; }
    .pie-slice:focus-visible {
      filter:
        drop-shadow(0 0 6px rgba(90,140,255,.95)) drop-shadow(0 0 6px rgba(90,140,255,.95))
        drop-shadow(0 0 14px rgba(90,140,255,.85));
    }
    /* outline can't follow clip-path, so a bright ring is faked with stacked drop-shadows around the wedge */
    .pie-slice.locked {
      filter:
        drop-shadow(2.5px 0 0 #00d4ff) drop-shadow(-2.5px 0 0 #00d4ff)
        drop-shadow(0 2.5px 0 #00d4ff) drop-shadow(0 -2.5px 0 #00d4ff)
        drop-shadow(1.8px 1.8px 0 #00d4ff) drop-shadow(-1.8px 1.8px 0 #00d4ff)
        drop-shadow(1.8px -1.8px 0 #00d4ff) drop-shadow(-1.8px -1.8px 0 #00d4ff);
    }
    /* combine both stacks so the locked ring and the tab-focus glow both show at once */
    .pie-slice.locked:focus-visible {
      filter:
        drop-shadow(2.5px 0 0 #00d4ff) drop-shadow(-2.5px 0 0 #00d4ff)
        drop-shadow(0 2.5px 0 #00d4ff) drop-shadow(0 -2.5px 0 #00d4ff)
        drop-shadow(1.8px 1.8px 0 #00d4ff) drop-shadow(-1.8px 1.8px 0 #00d4ff)
        drop-shadow(1.8px -1.8px 0 #00d4ff) drop-shadow(-1.8px -1.8px 0 #00d4ff)
        drop-shadow(0 0 6px rgba(90,140,255,.95)) drop-shadow(0 0 6px rgba(90,140,255,.95))
        drop-shadow(0 0 14px rgba(90,140,255,.85));
    }
    .info-panel { flex: 1 1 260px; max-width: 360px; font-family: sans-serif; }
    .info-panel h2 { margin: 0 0 8px; font-size: 1.3em; }
    .info-panel p { margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="layout" id="layout">
    <div class="pie-wrap" id="pieWrap">
      <img id="pieImg" src="Logos-empty.svg" alt="Five segment logo wheel">
    </div>
    <div class="info-panel" id="infoPanel">
      <h2 id="infoTitle">Hover a segment</h2>
      <p id="infoBody">Hover over a segment of the logo to see more information about it here.</p>
    </div>
  </div>
  <script>
    // Builds 5 clickable/hoverable wedges over the pentagon logo so a segment can "explode" outward on hover.
    // Assumes a regular 5-sided pentagon (straight edges, not arcs) with a vertex at the top (12 o'clock).
    const SEGMENT_COUNT = 5;
    const EXPLODE_DISTANCE = 22; // px to move a hovered slice outward
    const DEFAULT_INFO = { title: 'What we do', body: 'Hover over a segment of the logo to see more. Click to focus one segment, and click again to return to hovering' };
    // Placeholder copy per segment, in order: blue(0-72), black(72-144), pink(144-216), green(216-288), yellow(288-360)
    const SEGMENT_INFO = [
      { title: 'Bespoke Software Development', body: 'We can write software from scratch to solve a variety of research problems, in a range of languages.' },
      { title: 'Building and Running on HPC', body: 'We can help you build your software on our hardware, write slurm scripts to run it, and give advice about options beyond Warwick and HPC time applications' },
      { title: 'Teaching and Training', body: 'We run regular training sessions on software development topics, attend <a href="https://warwick.ac.uk/sc-dropin">drop-in</a> support sessions and can give custom seminars to your research group on request' },
      { title: 'Spin-out Software', body: 'We can help clean up and formalise software that might arise from your research which can be turned into a more widely usable package' },
      { title: 'Maintenance and Modernisation', body: 'We can help bring your software up-to-date, convert to newer language standards, clean it up and add testing and documentation too' },
    ];
    const infoTitle = document.getElementById('infoTitle');
    const infoBody = document.getElementById('infoBody');

    function showInfo(info) {
      infoTitle.textContent = info.title;
      infoBody.innerHTML = info.body;
    }

    function buildPieSlices(wrap, img) {
      const src = img.getAttribute('src');
      img.style.visibility = 'hidden'; // wedges recreate the visible pie; original stays only for sizing/fallback

      const layout = document.getElementById('layout');
      const infoPanel = document.getElementById('infoPanel');
      // so tabbing toward the link/info text doesn't clear it before it can be reached
      const leavingComponent = (relatedTarget) => !relatedTarget || !layout.contains(relatedTarget);

      const slices = []; // {el, dx, dy} in segment order, so click/hover can restore a locked segment
      let lockedIndex = null;

      function setActive(activeIndex) {
        slices.forEach((s, idx) => {
          s.el.style.transform = idx === activeIndex ? `translate(${s.dx}px, ${s.dy}px)` : '';
          s.el.classList.toggle('locked', idx === lockedIndex);
          s.el.setAttribute('aria-pressed', String(idx === lockedIndex));
          // while a segment is locked, drop the others from tab order so Tab goes straight to the shown description's links
          s.el.tabIndex = (lockedIndex === null || idx === lockedIndex) ? 0 : -1;
        });
        showInfo(activeIndex === null ? DEFAULT_INFO : SEGMENT_INFO[activeIndex]);
      }

      for (let i = 0; i < SEGMENT_COUNT; i++) {
        const startDeg = i * (360 / SEGMENT_COUNT);
        const endDeg = startDeg + (360 / SEGMENT_COUNT);
        const midRad = ((startDeg + endDeg) / 2) * Math.PI / 180;

        const slice = document.createElement('div');
        slice.className = 'pie-slice';
        slice.style.backgroundImage = `url(${src})`;
        slice.tabIndex = 0; // lets Tab cycle through segments in DOM order
        slice.setAttribute('role', 'button');
        slice.setAttribute('aria-label', SEGMENT_INFO[i].title);
        slice.setAttribute('aria-pressed', 'false');
        // radius 100: the badge circles bulge past the pentagon's true 50%-radius edges, so the clip is
        // extended well beyond them along the same angular boundaries (badges stay within their own sector)
        slice.style.clipPath = wedgeClipPath(startDeg, endDeg, 1, 100);

        const dx = Math.round(Math.sin(midRad) * EXPLODE_DISTANCE);
        const dy = Math.round(-Math.cos(midRad) * EXPLODE_DISTANCE);
        slices.push({ el: slice, dx, dy });

        slice.addEventListener('mouseenter', () => { if (lockedIndex === null) setActive(i); });
        slice.addEventListener('mouseleave', () => { if (lockedIndex === null) setActive(null); });
        slice.addEventListener('focus', () => { if (lockedIndex === null) setActive(i); });
        slice.addEventListener('blur', (e) => { if (lockedIndex === null && leavingComponent(e.relatedTarget)) setActive(null); });
        slice.addEventListener('click', () => { lockedIndex = lockedIndex === i ? null : i; setActive(i); });
        slice.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          lockedIndex = lockedIndex === i ? null : i;
          setActive(i);
        });

        wrap.appendChild(slice);
      }

      infoPanel.addEventListener('focusout', (e) => { if (lockedIndex === null && leavingComponent(e.relatedTarget)) setActive(null); });
    }

    function wedgeClipPath(startDeg, endDeg, steps = 1, radius = 50) {
      const points = ['50% 50%'];
      for (let step = 0; step <= steps; step++) {
        const deg = startDeg + (endDeg - startDeg) * (step / steps);
        const rad = deg * Math.PI / 180;
        const x = 50 + radius * Math.sin(rad);
        const y = 50 - radius * Math.cos(rad);
        points.push(`${x}% ${y}%`);
      }
      return `polygon(${points.join(', ')})`;
    }

    const pieImg = document.getElementById('pieImg');
    const pieWrap = document.getElementById('pieWrap');
    if (pieImg.complete) buildPieSlices(pieWrap, pieImg);
    else pieImg.addEventListener('load', () => buildPieSlices(pieWrap, pieImg));
  </script>
</body>
</html>
