<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Catalogue</title>
  <style>
    :root { --ink:#17282c; --muted:#65777b; --line:#d6e0dc; --paper:#fff; --canvas:#f1f5f1; --pine:#166357; --mint:#e2f0e8; --gold:#c68724; --coral:#be5948; }
    * { box-sizing:border-box; }
    body { min-width:320px; margin:0; color:var(--ink); background-color:var(--canvas); background-image:linear-gradient(90deg,rgba(22,99,87,.035) 1px,transparent 1px),linear-gradient(rgba(22,99,87,.035) 1px,transparent 1px); background-size:28px 28px; font-family:Georgia,"Times New Roman",serif; }
    button,input,select { font:inherit; }
    .shell { max-width:1320px; margin:0 auto; padding:38px 28px 52px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:24px; padding:8px 4px 29px; }
    .eyebrow,label { margin:0 0 8px; color:var(--pine); font-family:"Trebuchet MS",sans-serif; font-size:10px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(34px,4vw,54px); font-weight:400; line-height:1; }
    .subhead { max-width:510px; margin:11px 0 0; color:var(--muted); font-size:16px; line-height:1.5; }
    .view-label { margin:0; color:var(--muted); font-family:"Trebuchet MS",sans-serif; font-size:11px; text-align:right; }
    .view-label strong { display:block; margin-top:4px; color:var(--ink); font-size:13px; }
    .catalogue { overflow:hidden; border:1px solid var(--line); background:var(--paper); box-shadow:0 16px 38px rgba(28,50,46,.09); }
    .filters { display:grid; grid-template-columns:minmax(190px,1.6fr) repeat(3,minmax(120px,.8fr)) auto; gap:12px; padding:20px; border-bottom:1px solid var(--line); background:#fbfcfa; }
    .control { min-width:0; }
    label { display:block; margin-bottom:6px; color:var(--muted); }
    input,select { width:100%; height:40px; border:1px solid #bdcbc5; border-radius:3px; padding:0 11px; color:var(--ink); background:#fff; font-size:14px; outline:0; }
    input:focus,select:focus { border-color:var(--pine); box-shadow:0 0 0 3px rgba(22,99,87,.13); }
    #reset { align-self:end; height:40px; border:1px solid var(--pine); border-radius:3px; padding:0 15px; color:var(--pine); background:transparent; font-family:"Trebuchet MS",sans-serif; font-size:13px; font-weight:700; cursor:pointer; }
    #reset:hover { color:#fff; background:var(--pine); }
    .summary { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 20px; border-bottom:1px solid var(--line); }
    .summary p { margin:0; font-family:"Trebuchet MS",sans-serif; font-size:13px; font-weight:700; }
    #result-count { color:var(--pine); }
    .legend { display:flex; flex-wrap:wrap; gap:13px; color:var(--muted); font-family:"Trebuchet MS",sans-serif; font-size:11px; }
    .legend span { display:flex; align-items:center; gap:5px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--pine); }.medium { background:var(--gold); }.large { background:var(--coral); }
    .table-wrap { overflow-x:auto; } table { width:100%; min-width:810px; border-collapse:collapse; text-align:left; }
    th { padding:0; border-bottom:1px solid var(--line); background:#f4f7f4; }
    th button { display:flex; width:100%; align-items:center; gap:7px; border:0; padding:13px 20px; color:var(--muted); background:transparent; font-family:"Trebuchet MS",sans-serif; font-size:10px; font-weight:700; letter-spacing:1px; text-align:left; text-transform:uppercase; cursor:pointer; }
    th button:hover,th button[aria-sort="ascending"],th button[aria-sort="descending"] { color:var(--pine); }
    td { padding:17px 20px; border-bottom:1px solid #e4eae6; font-size:15px; } tbody tr:hover { background:#f7fbf8; } tbody tr:last-child td { border:0; }
    .project-name { font-weight:700; }.description { max-width:350px; color:var(--muted); }.language { color:var(--pine); font-family:"Trebuchet MS",sans-serif; font-size:13px; font-weight:700; }
    .pill { display:inline-block; border-radius:999px; padding:4px 9px; font-family:"Trebuchet MS",sans-serif; font-size:11px; font-weight:700; line-height:1; text-transform:capitalize; }.size-small { color:#21654c; background:#e1f1e7; }.size-medium { color:#865608; background:#fbefd5; }.size-large { color:#923d2c; background:#fae1dc; }
    .empty td { padding:54px 20px; color:var(--muted); text-align:center; }
    @media (max-width:820px) { .shell{padding:20px 14px 32px} header{align-items:start;flex-direction:column;gap:16px}.view-label{text-align:left}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.control:first-child{grid-column:1/-1}#reset{width:100%}.summary{align-items:start;flex-direction:column} }
    @media (max-width:460px) { .filters{grid-template-columns:1fr}.control:first-child{grid-column:auto} }
  </style>
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">Portfolio registry</p><h1>Project catalogue</h1><p class="subhead">Explore project records by language, scale, duration, and delivery date.</p></div><p class="view-label">CURRENT VIEW<strong id="view-label">All projects</strong></p></header>
    <section class="catalogue" aria-label="Project catalogue data">
      <div class="filters">
        <div class="control"><label for="search">Search records</label><input id="search" type="search" placeholder="Name, language, or description"></div>
        <div class="control"><label for="language-filter">Language</label><select id="language-filter"><option value="">All languages</option></select></div>
        <div class="control"><label for="size-filter">Project size</label><select id="size-filter"><option value="">All sizes</option></select></div>
        <div class="control"><label for="duration-filter">Duration</label><select id="duration-filter"><option value="">Any duration</option></select></div>
        <button id="reset" type="button">Reset view</button>
      </div>
      <div class="summary"><p><span id="result-count">0</span> projects shown</p><div class="legend"><span><i class="dot"></i>Small</span><span><i class="dot medium"></i>Medium</span><span><i class="dot large"></i>Large</span></div></div>
      <div class="table-wrap"><table><thead><tr id="table-head"></tr></thead><tbody id="table-body"></tbody></table></div>
    </section>
  </main>
  <script>
    const json_str = `[
      { "name": "Project 1", "language": "C++", "description": "A project", "duration": "6", "date": "01-01-26", "size": "small" },
      { "name": "Project 2", "language": "Python", "description": "A project", "duration": "6", "date": "01-04-26", "size": "medium" }
    ]`;

    const projects = JSON.parse(json_str);
    const columns = Object.keys(projects[0] || {});
    const labels = { name:'Project', language:'Language', description:'Description', duration:'Duration', date:'Date', size:'Size' };
    const state = { search:'', language:'', size:'', duration:'', sort:'name', direction:'asc' };
    const tableHead = document.querySelector('#table-head');
    const tableBody = document.querySelector('#table-body');

    function valueForSort(project, field) {
      if (field === 'duration') return Number(project[field]);
      if (field === 'date') { const [month, day, year] = project[field].split('-').map(Number); return new Date(2000 + year, month - 1, day).getTime(); }
      if (field === 'size') return ({ small:1, medium:2, large:3 })[String(project[field]).toLowerCase()] || 99;
      return String(project[field] || '').toLowerCase();
    }

    function populateFilter(selector, field) {
      const select = document.querySelector(selector);
      [...new Set(projects.map((project) => project[field]))].sort().forEach((value) => select.add(new Option(field === 'duration' ? `${value} months` : value, value)));
    }

    function renderHeaders() {
      tableHead.replaceChildren();
      columns.forEach((column) => {
        const cell = document.createElement('th'); const button = document.createElement('button');
        button.type = 'button'; button.textContent = labels[column] || column;
        button.setAttribute('aria-sort', state.sort === column ? (state.direction === 'asc' ? 'ascending' : 'descending') : 'none');
        if (state.sort === column) button.append(` ${state.direction === 'asc' ? '▲' : '▼'}`);
        button.addEventListener('click', () => { state.direction = state.sort === column && state.direction === 'asc' ? 'desc' : 'asc'; state.sort = column; render(); });
        cell.appendChild(button); tableHead.appendChild(cell);
      });
    }

    function render() {
      const term = state.search.trim().toLowerCase();
      const visible = projects.filter((project) =>
        (!term || ['name','language','description'].some((field) => String(project[field] || '').toLowerCase().includes(term))) &&
        (!state.language || project.language === state.language) && (!state.size || project.size === state.size) && (!state.duration || project.duration === state.duration)
      ).sort((a, b) => { const result = valueForSort(a, state.sort) < valueForSort(b, state.sort) ? -1 : valueForSort(a, state.sort) > valueForSort(b, state.sort) ? 1 : 0; return state.direction === 'asc' ? result : -result; });
      renderHeaders(); tableBody.replaceChildren();
      document.querySelector('#result-count').textContent = visible.length;
      document.querySelector('#view-label').textContent = visible.length === projects.length ? 'All projects' : 'Filtered projects';
      if (!visible.length) { const row = tableBody.insertRow(); row.className = 'empty'; const cell = row.insertCell(); cell.colSpan = columns.length; cell.textContent = 'No projects match these filters.'; return; }
      visible.forEach((project) => { const row = tableBody.insertRow(); columns.forEach((column) => { const cell = row.insertCell(); const value = project[column] ?? ''; if (column === 'name') cell.className = 'project-name'; if (column === 'description') cell.className = 'description'; if (column === 'language') cell.className = 'language'; if (column === 'size') { const badge = document.createElement('span'); badge.className = `pill size-${String(value).toLowerCase()}`; badge.textContent = value; cell.appendChild(badge); } else { cell.textContent = column === 'duration' ? `${value} months` : value; } }); });
    }

    populateFilter('#language-filter', 'language'); populateFilter('#size-filter', 'size'); populateFilter('#duration-filter', 'duration');
    [['#search','search','input'],['#language-filter','language','change'],['#size-filter','size','change'],['#duration-filter','duration','change']].forEach(([selector, field, event]) => document.querySelector(selector).addEventListener(event, (input) => { state[field] = input.target.value; render(); }));
    document.querySelector('#reset').addEventListener('click', () => { Object.assign(state, { search:'', language:'', size:'', duration:'', sort:'name', direction:'asc' }); ['#search','#language-filter','#size-filter','#duration-filter'].forEach((selector) => { document.querySelector(selector).value = ''; }); render(); });
    render();
  </script>
</body>
</html>
